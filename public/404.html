<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KinPOS - Redirecting...</title>
    <script>
      (function() {
        var pathSegments = window.location.pathname.split('/');
        var cleanSegments = pathSegments.filter(Boolean);
        if (cleanSegments.length > 0) {
          window.location.replace(window.location.origin.concat('/', cleanSegments[0], '/'));
        } else {
          window.location.replace(window.location.origin);
        }
      })();
    </script>
  </head>
  <body style="margin:0;padding:2rem;background:#171717;color:#fff;font-family:sans-serif;text-align:center;">
    <p>Loading KinPOS...</p>
  </body>
</html>
