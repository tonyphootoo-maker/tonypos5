<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KinPOS - Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var pathSegments = window.location.pathname.split('/');
        var cleanSegments = pathSegments.filter(Boolean);
        // On GitHub Pages: https://<username>.github.io/<repo>/...
        // cleanSegments[0] is the repository name
        if (cleanSegments.length > 0) {
          window.location.replace('/' + cleanSegments[0] + '/');
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="margin:0;padding:2rem;background:#171717;color:#fff;font-family:sans-serif;text-align:center;">
    <p>Loading KinPOS...</p>
  </body>
</html>
