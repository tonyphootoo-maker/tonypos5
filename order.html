<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="สั่งอาหาร" />
    <link rel="apple-touch-icon" sizes="180x180" href="./order-apple-touch-icon.png" />
    <link rel="icon" href="./order-192x192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="./order-512x512.png" sizes="512x512" type="image/png" />
    <link rel="manifest" href="./manifest-order.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>สั่งอาหารออนไลน์ | Tony's Kitchen Express</title>
    <meta name="description" content="สั่งอาหารออนไลน์ เดลิเวอรีและรับเองที่ร้าน พร้อมติดตามสถานะออเดอร์เรียลไทม์" />
    <meta property="og:title" content="สั่งอาหารออนไลน์ | Tony's Kitchen Express" />
    <meta property="og:description" content="สั่งอาหารออนไลน์ เดลิเวอรีและรับเองที่ร้าน พร้อมติดตามสถานะออเดอร์เรียลไทม์" />
    <meta property="og:type" content="website" />
    <script>
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
      });
      window.addEventListener('error', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          msgEl.innerText = 'Initialization Error: ' + (e.message || 'Script loading failure') + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          msgEl.innerText = 'Initialization Error: ' + reason + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      });
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#FAF8F5;">
    <noscript>
      <div style="padding: 2rem; color: #fff; background: #991b1b; text-align: center; font-family: sans-serif;">
        JavaScript is required to order online. Please enable JavaScript in your browser settings. / กรุณาเปิดใช้งาน JavaScript
      </div>
    </noscript>
    <div id="root">
      <div id="boot-msg" style="min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', system-ui, sans-serif; color: #0f172a; background: #FAF8F5; text-align: center; padding: 1.5rem; box-sizing: border-box;">
        <img src="./order-192x192.png" alt="Store Logo" referrerPolicy="no-referrer" style="width: 76px; height: 76px; border-radius: 20px; object-fit: contain; background: #ffffff; margin-bottom: 16px; border: 1px solid #fed7aa; box-shadow: 0 12px 24px rgba(234, 88, 12, 0.14);" />
        <h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px;">สั่งอาหารออนไลน์</h2>
        <p id="boot-status" style="margin: 8px 0 0; font-size: 13px; color: #ea580c; font-weight: 600;">กำลังโหลดเมนูร้านอาหาร... / Loading Online Menu...</p>
        <button id="boot-retry-btn" type="button" onclick="window.location.reload()" style="display: none; margin-top: 16px; padding: 10px 18px; border-radius: 12px; border: 0; background: #ea580c; color: #ffffff; font-size: 13px; font-weight: 800; cursor: pointer;">รีเฟรชหน้าเว็บ / Reload</button>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var bootEl = document.getElementById('boot-msg');
        if (!bootEl) return;
        var statusEl = document.getElementById('boot-status');
        var retryBtn = document.getElementById('boot-retry-btn');
        if (statusEl) {
          statusEl.innerText = 'การโหลดใช้เวลานานกว่าปกติ กรุณากดรีเฟรช / Loading is taking longer than expected';
        }
        if (retryBtn) {
          retryBtn.style.display = 'inline-block';
        }
      }, 12000);
    </script>
    <script type="module" src="./src/main.tsx" onerror="var s=document.getElementById('boot-status');var b=document.getElementById('boot-retry-btn');if(s){s.style.color='#e11d48';s.innerText='ไม่สามารถโหลดสคริปต์แอปได้ กรุณากดรีเฟรช / Failed to load app module';}if(b){b.style.display='inline-block';}"></script>
  </body>
</html>
