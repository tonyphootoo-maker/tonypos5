<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tony's Kit" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Tony's Kit - Restaurant POS &amp; Food Cost Engine</title>
    <meta name="description" content="Bilingual Thai/English restaurant POS, live food cost calculation, recipe engineering, floor plan tables, shifts, and financial P&amp;L reporting." />
    <meta property="og:title" content="Tony's Kit - Restaurant POS &amp; Food Cost Engine" />
    <meta property="og:description" content="Bilingual Thai/English restaurant POS, live food cost calculation, recipe engineering, floor plan tables, shifts, and financial P&amp;L reporting." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        var path = window.location.pathname;
        var cleanPath = path.replace(/\/+$/, '');
        if (cleanPath === '/order' || cleanPath.endsWith('/order')) {
          var prefixO = cleanPath.slice(0, cleanPath.length - '/order'.length) || '';
          var paramsO = new URLSearchParams(window.location.search || '');
          if (!paramsO.get('mode')) paramsO.set('mode', 'order');
          window.location.replace(window.location.origin + prefixO + '/?' + paramsO.toString() + window.location.hash);
          return;
        }
        if (cleanPath === '/rider' || cleanPath.endsWith('/rider')) {
          var prefixR = cleanPath.slice(0, cleanPath.length - '/rider'.length) || '';
          var paramsR = new URLSearchParams(window.location.search || '');
          paramsR.delete('mode');
          var qsR = paramsR.toString();
          window.location.replace(window.location.origin + prefixR + '/rider.html' + (qsR ? '?' + qsR : '') + window.location.hash);
          return;
        }
        var earlyParams = new URLSearchParams(window.location.search || '');
        var earlyMode = (earlyParams.get('mode') || '').toLowerCase();
        var earlyHashLower = (window.location.hash || '').toLowerCase();
        if (earlyMode === 'rider' || earlyHashLower.indexOf('mode=rider') !== -1) {
          var cleanRoot = cleanPath.replace(/\/index\.html$/i, '');
          var prefixRoot = cleanRoot === '' ? '' : cleanRoot;
          earlyParams.delete('mode');
          var qsRoot = earlyParams.toString();
          window.location.replace(window.location.origin + prefixRoot + '/rider.html' + (qsRoot ? '?' + qsRoot : '') + window.location.hash);
          return;
        }
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin.concat(path, '/', window.location.search, window.location.hash));
          return;
        }

        var params = new URLSearchParams(window.location.search || '');
        var mode = (params.get('mode') || '').toLowerCase();
        var hashLower = (window.location.hash || '').toLowerCase();
        var pathLower = cleanPath.toLowerCase();
        var isRider =
          mode === 'rider' ||
          pathLower === '/rider' ||
          pathLower.endsWith('/rider') ||
          pathLower.endsWith('/rider.html') ||
          hashLower.indexOf('mode=rider') !== -1;
        var isOrder =
          mode === 'order' ||
          mode === 'customer' ||
          pathLower === '/order' ||
          pathLower.endsWith('/order') ||
          hashLower.indexOf('mode=order') !== -1 ||
          hashLower.indexOf('mode=customer') !== -1;

        var existingManifests = document.querySelectorAll('link[rel="manifest"]');
        for (var i = 0; i < existingManifests.length; i++) {
          existingManifests[i].parentNode.removeChild(existingManifests[i]);
        }

        if (isRider) {
          document.title = "Tony's Kit Rider - งานจัดส่ง";
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', "Tony's Kit Rider");
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.setAttribute('href', './rider-apple-touch-icon.png');
          var svgIcon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
          if (svgIcon) svgIcon.setAttribute('href', './rider-icon.svg');
          var riderManifest = document.createElement('link');
          riderManifest.rel = 'manifest';
          riderManifest.href = './manifest-rider.webmanifest';
          document.head.appendChild(riderManifest);
        } else if (isOrder) {
          document.title = "สั่งอาหารออนไลน์ | Online Order";
          var orderTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (orderTitle) orderTitle.setAttribute('content', 'สั่งอาหาร');
          var orderManifest = document.createElement('link');
          orderManifest.rel = 'manifest';
          orderManifest.href = './manifest-order.webmanifest';
          document.head.appendChild(orderManifest);
        } else {
          var ownerManifest = document.createElement('link');
          ownerManifest.rel = 'manifest';
          ownerManifest.href = './manifest.webmanifest';
          document.head.appendChild(ownerManifest);
        }
      })();

      window.addEventListener('error', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          msgEl.innerText = 'Initialization Error: ' + (e.message || 'Script loading failure') + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          msgEl.innerText = 'Initialization Error: ' + reason + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      });
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#eef2f7;">
    <noscript>
      <div style="padding: 2rem; color: #fff; background: #991b1b; text-align: center; font-family: sans-serif;">
        JavaScript is required to run Tony's Kit. Please enable JavaScript in your browser settings. / กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์ของคุณ
      </div>
    </noscript>
    <div id="root">
      <div id="boot-msg" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', system-ui, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f6f8fc 0%, #e9eef5 100%); text-align: center; padding: 1.5rem;">
        <div style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #f97316, #ea580c); color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; margin-bottom: 16px; box-shadow: 0 5px 0 #c2410c, 0 14px 28px rgba(234, 88, 12, 0.28); border: 1px solid rgba(255,255,255,0.4);">T</div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">Tony's Kit</h2>
        <p id="boot-status" style="margin: 8px 0 0; font-size: 13px; color: #ea580c; font-weight: 600;">Loading Tony's Kit... / กำลังโหลด...</p>
        <button id="boot-retry-btn" type="button" onclick="window.location.reload()" style="display: none; margin-top: 16px; padding: 10px 18px; border-radius: 12px; border: 0; background: #ea580c; color: #ffffff; font-size: 13px; font-weight: 700; cursor: pointer;">รีเฟรชหน้าเว็บ / Reload</button>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var bootEl = document.getElementById('boot-msg');
        if (!bootEl) return;
        var statusEl = document.getElementById('boot-status');
        var retryBtn = document.getElementById('boot-retry-btn');
        if (statusEl) {
          statusEl.innerText = 'การโหลดใช้เวลานานกว่าปกติ กรุณากดรีเฟรช / Loading is taking longer than expected';
        }
        if (retryBtn) {
          retryBtn.style.display = 'inline-block';
        }
      }, 12000);
    </script>
    <script type="module" src="./src/main.tsx" onerror="var s=document.getElementById('boot-status');var b=document.getElementById('boot-retry-btn');if(s){s.style.color='#e11d48';s.innerText='ไม่สามารถโหลดสคริปต์แอปได้ กรุณากดรีเฟรช / Failed to load app module';}if(b){b.style.display='inline-block';}"></script>
  </body>
</html>
