<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KinPOS" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>KinPOS - Restaurant POS &amp; Food Cost Engine</title>
    <meta name="description" content="Bilingual Thai/English restaurant POS, live food cost calculation, recipe engineering, floor plan tables, shifts, and financial P&amp;L reporting." />
    <meta property="og:title" content="KinPOS - Restaurant POS &amp; Food Cost Engine" />
    <meta property="og:description" content="Bilingual Thai/English restaurant POS, live food cost calculation, recipe engineering, floor plan tables, shifts, and financial P&amp;L reporting." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin.concat(path, '/', window.location.search, window.location.hash));
        }
      })();

      window.addEventListener('error', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          msgEl.innerText = 'Initialization Error: ' + (e.message || 'Script loading failure') + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msgEl = document.getElementById('boot-status');
        if (msgEl) {
          msgEl.style.color = '#e11d48';
          var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          msgEl.innerText = 'Initialization Error: ' + reason + '\n(โปรดตรวจสอบการเชื่อมต่อหรือรีเฟรชหน้าเว็บ)';
        }
      });
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#eef2f7;">
    <noscript>
      <div style="padding: 2rem; color: #fff; background: #991b1b; text-align: center; font-family: sans-serif;">
        JavaScript is required to run KinPOS. Please enable JavaScript in your browser settings. / กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์ของคุณ
      </div>
    </noscript>
    <div id="root">
      <div id="boot-msg" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', system-ui, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f6f8fc 0%, #e9eef5 100%); text-align: center; padding: 1.5rem;">
        <div style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #f97316, #ea580c); color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; margin-bottom: 16px; box-shadow: 0 5px 0 #c2410c, 0 14px 28px rgba(234, 88, 12, 0.28); border: 1px solid rgba(255,255,255,0.4);">K</div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">KinPOS</h2>
        <p id="boot-status" style="margin: 8px 0 0; font-size: 13px; color: #ea580c; font-weight: 600;">Loading KinPOS... / กำลังโหลด...</p>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
