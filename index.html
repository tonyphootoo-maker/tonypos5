    <script>
      // Fix GitHub Pages path resolution: ensure directory paths have trailing slash
      // so that relative asset paths like './assets/index-xxx.js' resolve correctly
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
